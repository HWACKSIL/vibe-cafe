<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- 외부 스타일시트 연결 (추후 스타일링 예정) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 페이지 상단 헤더 영역 -->
  <header>
    <div class="logo" style="font-size: 3rem;">☕</div>
    <h1>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- 메인 주문 폼 영역 (브라우저 기본 유효성 검사 비활성화를 위해 novalidate 적용) -->
  <main>
    <!-- 탭 메뉴 (주문하기 / 주문 내역) -->
    <nav class="tab-menu" aria-label="메인 탭 메뉴">
      <button type="button" id="tabBtnOrder" class="tab-btn active">☕ 주문하기</button>
      <button type="button" id="tabBtnHistory" class="tab-btn">
        📋 주문 내역 <span id="orderCountBadge" class="badge">0</span>
      </button>
    </nav>

    <!-- 1. 주문하기 탭 내용 (주문서 폼 및 확인 메시지) -->
    <section id="tabOrderSection" class="tab-content">
      <form id="orderForm" novalidate>
      
      <!-- 1. 주문자 이름 (필수 입력 항목) -->
      <div>
        <label for="userName">이름</label>
        <input type="text" id="userName" name="userName">
      </div>

      <!-- 2. 전화번호 입력 항목 -->
      <div>
        <label for="phone">전화번호</label>
        <input type="tel" id="phone" name="phone" placeholder="010-0000-0000">
      </div>

      <!-- 3. 음료 선택 드롭다운 -->
      <div>
        <label for="beverage">음료 선택</label>
        <select id="beverage" name="beverage">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 3,500원</option>
          <option value="latte" data-price="4000">카페라떼 4,000원</option>
          <option value="mocha" data-price="4500">카페모카 4,500원</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
          <option value="strawberry-latte" data-price="5000">딸기라떼 5,000원</option>
        </select>
      </div>

      <!-- 4. 사이즈 선택 라디오 버튼 -->
      <fieldset>
        <legend>사이즈</legend>
        <div>
          <input type="radio" id="size-s" name="size" value="S" data-price="0">
          <label for="size-s">S (+0원)</label>
        </div>
        <div>
          <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
          <label for="size-m">M (+500원)</label>
        </div>
        <div>
          <input type="radio" id="size-l" name="size" value="L" data-price="1000">
          <label for="size-l">L (+1,000원)</label>
        </div>
      </fieldset>

      <!-- 5. 추가 옵션 체크박스 -->
      <fieldset>
        <legend>추가 옵션</legend>
        <div>
          <input type="checkbox" id="opt-shot" name="option" value="shot" data-price="500">
          <label for="opt-shot">샷 추가 (+500원)</label>
        </div>
        <div>
          <input type="checkbox" id="opt-cream" name="option" value="cream" data-price="500">
          <label for="opt-cream">크림 추가 (+500원)</label>
        </div>
        <div>
          <input type="checkbox" id="opt-syrup" name="option" value="syrup" data-price="300">
          <label for="opt-syrup">시럽 추가 (+300원)</label>
        </div>
        <div>
          <input type="checkbox" id="opt-decaf" name="option" value="decaf" data-price="0">
          <label for="opt-decaf">디카페인 (+0원)</label>
        </div>
      </fieldset>

      <!-- 6. 수량 입력 항목 -->
      <div>
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 7. 요청사항 입력 항목 -->
      <div>
        <label for="requests">요청사항</label>
        <textarea id="requests" name="requests" rows="4" cols="50" placeholder="요청사항이 있으시면 적어주세요."></textarea>
      </div>

      <!-- 8. 예상 금액 표시 영역 -->
      <div id="priceDisplayArea">
        <p>예상 금액: <span id="totalPrice">0</span>원</p>
      </div>

      <!-- 9 & 10. 주문하기 및 다시 작성 버튼 -->
      <div>
        <button type="submit" id="submitBtn">주문하기</button>
        <button type="reset" id="resetBtn">다시 작성</button>
      </div>

    </form>

    <!-- 11. 주문 확인 메시지 영역 (초기 상태 숨김 처리) -->
    <div id="orderConfirmation" hidden></div>
  </section>

  <!-- 2. 주문 내역 탭 내용 (초기 상태 숨김) -->
  <section id="tabHistorySection" class="tab-content hidden">
    <!-- 주문 내역 카드 목록이 렌더링되는 컨테이너 -->
    <div id="orderList" class="order-list">
      <!-- renderOrders() 함수를 통해 동적으로 카드가 렌더링됩니다 -->
    </div>

    <!-- 주문 내역 하단: 총 주문 금액 통계 및 전체 삭제 버튼 -->
    <div id="orderSummaryArea" class="order-summary-area">
      <p id="totalOrdersSummary" class="total-orders-summary">총 주문 금액: 0원 (0건)</p>
      <button type="button" id="clearAllBtn" class="clear-all-btn">내역 모두 지우기</button>
    </div>
  </section>
</main>

  <!-- Supabase JS v2 라이브러리 (CDN) 연결 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 메인 자바스크립트 파일 연결 -->
  <script src="script.js"></script>
</body>
</html>
